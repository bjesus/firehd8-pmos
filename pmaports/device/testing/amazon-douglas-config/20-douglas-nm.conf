# The MT6625L driver has no SIOCSIFHWADDR: any cloned-MAC setting makes
# NetworkManager fail to activate Wi-Fi. The driver also reflects ARP probes,
# which makes address conflict detection decline every DHCP lease.
[device]
wifi.scan-rand-mac-address=no

[connection]
wifi.cloned-mac-address=preserve
ipv4.dad-timeout=0
