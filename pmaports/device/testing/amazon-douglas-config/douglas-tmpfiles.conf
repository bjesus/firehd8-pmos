# The kernel boots with the 'performance' governor on purpose (known-good top
# OPP, no transition before userspace); switch to schedutil here so it stays
# revertible without a reflash. Charger: 1.5 A input / 1.536 A charge current.
w /sys/devices/system/cpu/cpufreq/policy0/scaling_governor - - - - schedutil
w /sys/class/power_supply/bq24190-charger/input_current_limit - - - - 1500000
w /sys/class/power_supply/bq24190-charger/constant_charge_current - - - - 1536000
