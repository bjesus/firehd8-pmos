[device]
wifi.scan-rand-mac-address=no

[connection]
# the MT6625L driver has no set-MAC support (SIOCSIFHWADDR: Not supported);
# any cloned-mac setting makes NM fail with "could not be readied for configuration"
wifi.cloned-mac-address=preserve
# the driver reflects our own ARP probes, so NM address-conflict detection declines every
# DHCPv4 lease; disable ACD (udhcpc, which does no ACD, always succeeds)
ipv4.dad-timeout=0
